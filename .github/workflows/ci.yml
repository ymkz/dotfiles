name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CI: true
  TZ: Asia/Tokyo
  DO_NOT_TRACK: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify action lockfile
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.0
          gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes zsh
      - run: |
          bash -n setup.sh bin/xdg-open
          zsh -n zsh/*.zsh
      - run: shellcheck setup.sh bin/xdg-open
